name: Tests and Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Check code formatting and linting
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run test suite with pytest
        run: |
          pytest --tb=short

      - name: Verify CLI executable works
        run: |
          contribution-city generate --input examples/sample-contributions.json --theme navy-cyan --output dist/ci-test.svg
          test -f dist/ci-test.svg || exit 1
        shell: bash

      - name: Test composite action directly
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: ./
        with:
          input: examples/sample-contributions.json
          theme: matrix-green
          layout: compact
          output: dist/composite-action-test.svg

      - name: Verify composite action output was generated
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          test -f dist/composite-action-test.svg || exit 1
        shell: bash
