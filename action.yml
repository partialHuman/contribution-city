name: "Contribution City"
description: "Transform GitHub contribution activity into beautiful isometric pixel-art cities rendered as SVG."
author: "Contribution City Contributors"

inputs:
  username:
    description: "GitHub username whose contributions to visualize (defaults to repository owner if neither input nor config is specified)"
    required: false
    default: ""
  token:
    description: "GitHub personal access token or GITHUB_TOKEN for GraphQL API access"
    required: false
    default: "${{ github.token }}"
  theme:
    description: "Visual theme (navy-cyan, matrix-green, sunset-neon, monochrome-slate, solar-amber)"
    required: false
    default: "navy-cyan"
  layout:
    description: "City grid layout (calendar, compact, isometric)"
    required: false
    default: "calendar"
  config:
    description: "Path to optional YAML configuration file"
    required: false
    default: ""
  input:
    description: "Path to local JSON contributions file (for offline/fixture mode)"
    required: false
    default: ""
  output:
    description: "Destination file path for the generated SVG"
    required: false
    default: "dist/city.svg"
  width:
    description: "SVG canvas width in pixels"
    required: false
    default: ""
  height:
    description: "SVG canvas height in pixels"
    required: false
    default: ""
  scale:
    description: "Building height scaling multiplier"
    required: false
    default: ""

outputs:
  svg-path:
    description: "Path to the generated SVG city visualization"
    value: "${{ steps.generate.outputs.svg-path }}"

runs:
  using: "composite"
  steps:
    - name: "Set up Python runtime"
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: "Install Contribution City"
      shell: bash
      run: |
        python -m pip install --no-cache-dir "${{ github.action_path }}"

    - name: "Generate Contribution City SVG"
      id: generate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        ARGS=(generate --output "${{ inputs.output }}" --theme "${{ inputs.theme }}" --layout "${{ inputs.layout }}")

        if [ -n "${{ inputs.config }}" ]; then
          ARGS+=(--config "${{ inputs.config }}")
        fi

        if [ -n "${{ inputs.input }}" ]; then
          ARGS+=(--input "${{ inputs.input }}")
        elif [ -n "${{ inputs.username }}" ]; then
          ARGS+=(--username "${{ inputs.username }}")
        elif [ -z "${{ inputs.config }}" ]; then
          ARGS+=(--username "${{ github.repository_owner }}")
        fi

        if [ -n "${{ inputs.width }}" ]; then
          ARGS+=(--width "${{ inputs.width }}")
        fi

        if [ -n "${{ inputs.height }}" ]; then
          ARGS+=(--height "${{ inputs.height }}")
        fi

        if [ -n "${{ inputs.scale }}" ]; then
          ARGS+=(--scale "${{ inputs.scale }}")
        fi

        python -m contribution_city.cli "${ARGS[@]}"
        echo "svg-path=${{ inputs.output }}" >> "$GITHUB_OUTPUT"

branding:
  icon: "map"
  color: "blue"
