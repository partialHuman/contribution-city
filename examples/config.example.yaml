# Contribution City Configuration Example
username: octocat-architect
theme: navy-cyan
layout: calendar
output: dist/city.svg

city:
  width: 1200
  height: 680
  building_scale: 1.0
  min_building_height: 6.0
  max_building_height: 125.0
  show_windows: true
  show_stars: true
  show_header: true
  show_platform: true
  show_zero_tiles: true
