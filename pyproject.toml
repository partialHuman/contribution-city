[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contribution-city"
dynamic = ["version"]
description = "Transform GitHub contribution activity into beautiful isometric pixel-art cities rendered as SVG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "partialHuman" }
]
keywords = ["github", "contributions", "svg", "isometric", "pixel-art", "visualization", "profile"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
visual = [
    "resvg-py>=0.5.0",
    "Pillow>=10.1.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17.0",
    "resvg-py>=0.5.0",
    "Pillow>=10.1.0",
]

[project.scripts]
contribution-city = "contribution_city.cli:main"

[tool.hatch.version]
path = "src/contribution_city/_version.py"

[project.urls]
Homepage = "https://github.com/partialHuman/contribution-city"
Issues = "https://github.com/partialHuman/contribution-city/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/contribution_city"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "baseline: pixel comparison against the approved visual baselines (run on one OS in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line length handled by formatter
]
